<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply for Job - JobNestHub</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<!-- Navigation -->

<nav>

    <h2>JobNestHub</h2>

    <a href="index.html">Home</a>

    <a href="jobs.html">Jobs</a>

</nav>


<!-- Application Section -->

<section class="jobs">

    <h1>Apply for Job</h1>

    <div class="job-card">

        <h2 id="jobTitle">Loading job...</h2>

        <p id="jobCompany"></p>

        <p id="jobLocation"></p>

        <p id="jobSalary"></p>


        <form id="applicationForm">

            <label for="coverLetter">
                Cover Letter
            </label>

            <br><br>

            <textarea
                id="coverLetter"
                rows="8"
                placeholder="Write your cover letter here..."
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Submit Application
            </button>

        </form>

        <p id="message"></p>

    </div>

</section>


<script>

    // ===============================
    // Get Job ID from URL
    // ===============================

    const urlParams = new URLSearchParams(
        window.location.search
    );

    const jobId = urlParams.get("job_id");

    console.log("DEBUG JOB ID:", jobId);


    // ===============================
    // Backend API URL
    // ===============================

    const API_URL =
        "https://jobnesthub-backend.onrender.com";


    // ===============================
    // Load Selected Job
    // ===============================

    async function loadJob() {

        try {

            const response = await fetch(
                `${API_URL}/api/jobs`
            );

            if (!response.ok) {

                throw new Error(
                    "Could not load jobs."
                );

            }

            const data = await response.json();

            const job = data.jobs.find(
                job => Number(job.id) === Number(jobId)
            );


            if (!job) {

                document.getElementById("jobTitle").textContent =
                    "Job not found.";

                return;

            }


            document.getElementById("jobTitle").textContent =
                job.title;

            document.getElementById("jobCompany").textContent =
                "Company: " + job.company;

            document.getElementById("jobLocation").textContent =
                "Location: " + job.location;

            document.getElementById("jobSalary").textContent =
                "Salary: " + (job.salary || "Not specified");


        } catch (error) {

            console.error(
                "Error loading job:",
                error
            );

            document.getElementById("jobTitle").textContent =
                "Unable to load job.";

        }

    }


    // ===============================
    // Submit Application
    // ===============================

    document
        .getElementById("applicationForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // ===============================
                // Check Job ID
                // ===============================

                if (!jobId || isNaN(Number(jobId))) {

                    document.getElementById("message").textContent =
                        "No valid job selected. Please go back to the Jobs page and select a job.";

                    return;

                }


                // ===============================
                // Get Cover Letter
                // ===============================

                const coverLetter =
                    document
                        .getElementById("coverLetter")
                        .value
                        .trim();


                // ===============================
                // Get Logged-in User
                // ===============================

                const user =
                    JSON.parse(
                        localStorage.getItem("user")
                    );

                console.log("DEBUG USER:", user);
                console.log("DEBUG JOB ID:", jobId);


                // ===============================
                // Check Login
                // ===============================

                if (!user) {

                    document.getElementById("message").textContent =
                        "Please login before applying for a job.";

                    return;

                }


                // ===============================
                // Get User ID
                // ===============================

                const userId =
                    Number(user.id || user.user_id);

                console.log("DEBUG USER ID:", userId);


                if (!userId || isNaN(userId)) {

                    document.getElementById("message").textContent =
                        "Unable to identify your user account. Please login again.";

                    return;

                }


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/applications`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    job_id:
                                        Number(jobId),

                                    user_id:
                                        userId,

                                    cover_letter:
                                        coverLetter

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Application failed."
                        );

                    }


                    document.getElementById("message").textContent =
                        "Application submitted successfully!";


                    document
                        .getElementById("applicationForm")
                        .reset();


                } catch (error) {

                    console.error(
                        "Application error:",
                        error
                    );

                    document.getElementById("message").textContent =
                        error.message;

                }

            }
        );


    // ===============================
    // Start
    // ===============================

    if (jobId) {

        loadJob();

    } else {

        document.getElementById("jobTitle").textContent =
            "No job selected.";

        document.getElementById("message").textContent =
            "Please go back to the Jobs page and select a job.";

    }

</script>
```

</body>

</html>
